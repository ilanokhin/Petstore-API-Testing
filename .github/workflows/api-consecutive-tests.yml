name: Последовательные API автотесты

on:
  workflow_dispatch:

jobs:
  api-tests:
    name: Последовательные API автотесты
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Проверка кэша
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: api.tar
          key: python-api-testing

      - name: Загрузка образа в Docker (если был в кэше)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: docker load -i api.tar

      - name: Загрузка образа с Docker Hub (если не было в кэше)
        id: docker-pull
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          docker pull ilanokhin/python-api-testing:latest
          docker tag ilanokhin/python-api-testing:latest python-api-testing:latest
        continue-on-error: true

      - name: Сборка Docker образа (если загрузка не удалась)
        if: steps.docker-pull.outcome == 'failure'
        run: docker build -t python-api-testing:latest -f ./Dockerfile .

      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-api-testing:latest \
            /bin/sh -c "pytest"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-api-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
