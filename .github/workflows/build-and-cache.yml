name: Сборка и кэширование образа

on:
  workflow_dispatch:

jobs:
  build-and-cache:
    name: Сборка и кэширование образа
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Сборка Docker образа
        run: |
          docker build -t python-api-testing:latest -f ./Dockerfile .
          docker save python-api-testing:latest > api.tar

      - name: Сохранение собранного образа в кэш
        uses: actions/cache/save@v6
        with:
          path: api.tar
          key: python-api-testing
