name: Сборка докер образа
on:
  workflow_dispatch:
env:
  REGISTRY: ilanokhin
  IMAGE: python-api-testing:latest
  TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  build-docker-image:
    name: Сборка докер образа
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Вход в Docker Hub
        run: docker login -u ilanokhin -p $TOKEN

      - name: Сборка образа
        run: docker build -t $REGISTRY/$IMAGE -f ./Dockerfile .

      - name: Отправка образа в Docker Hub
        run: docker push $REGISTRY/$IMAGE
